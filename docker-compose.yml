# docker-compose.yml для продакшн-стенда МедКвадрат на 192.168.2.122
#
# Запуск:  ./deploy.sh      (при первичной установке и для ручного деплоя)
# Логи:    docker compose logs -f [сервис]
# Статус:  docker compose ps
#
# Оба образа тянутся из ghcr.io. Сборка идёт в GitHub Actions
# в репозиториях medkvadrat-patient-api и medkvadrat-max-bot.

services:
  api-gateway:
    image: ghcr.io/${GHCR_OWNER}/medkvadrat-patient-api:latest
    container_name: medkvadrat-api-gateway
    restart: unless-stopped
    environment:
      # --- MSSQL Medialog ---
      DB_SERVER: ${DB_SERVER}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # --- API ---
      API_PORT: ":8080"
      API_TOKEN: ${API_TOKEN}
      DEFAULT_MODELS_ID: ${DEFAULT_MODELS_ID:-306}
      CANCEL_MIN_HOURS_BEFORE: ${CANCEL_MIN_HOURS_BEFORE:-24}
      # SQLite (OTP, refresh tokens, rate limits) — must be on a mounted volume
      GATEWAY_DB_PATH: /app/data/gateway.db
      # Auth (step 2+): not dev
      # Use pilot + JWT/OTP in production; dev keeps one-shot OTP without secrets.
      AUTH_MODE: ${AUTH_MODE:-dev}
      AUTH_PILOT_WHITELIST: ${AUTH_PILOT_WHITELIST:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-medkvadrat-patient-api}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-МедКвадрат}
      SMTP_TLS: ${SMTP_TLS:-starttls}
    volumes:
      - gateway-data:/app/data
    ports:
      # Наружу публикуем только для отладки и для возможности дёрнуть
      # из других внутренних сервисов клиники. Если не нужно — убрать.
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  max-bot:
    image: ghcr.io/${GHCR_OWNER}/medkvadrat-max-bot:latest
    container_name: medkvadrat-max-bot
    restart: unless-stopped
    environment:
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      # Внутри compose-сети api-gateway доступен по имени сервиса
      GATEWAY_URL: http://api-gateway:8080
      GATEWAY_TOKEN: ${API_TOKEN}
      DB_PATH: /app/data/bot.db
    depends_on:
      api-gateway:
        condition: service_healthy
    volumes:
      # Именованный том для SQLite — переживает docker compose down и обновления образа.
      # На хосте: /var/lib/docker/volumes/medkvadrat-bot-data/_data/bot.db
      - bot-data:/app/data
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge
    name: medkvadrat-internal

volumes:
  bot-data:
    name: medkvadrat-bot-data
  gateway-data:
    name: medkvadrat-gateway-data
