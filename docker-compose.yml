# docker-compose.yml для продакшн-стенда МедКвадрат на 192.168.2.104
#
# Запуск:  ./deploy.sh      (при первичной установке и для ручного деплоя)
# Логи:    docker compose logs -f [сервис]
# Статус:  docker compose ps
#
# Оба образа тянутся из ghcr.io. Сборка идёт в GitHub Actions
# в репозиториях medkvadrat-patient-api и medkvadrat-max-bot.

services:
  api-gateway:
    image: ghcr.io/${GHCR_OWNER}/medkvadrat-patient-api:latest
    container_name: medkvadrat-api-gateway
    restart: unless-stopped
    environment:
      # --- MSSQL Medialog ---
      DB_SERVER: ${DB_SERVER}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_RW_USER: ${DB_RW_USER:-}
      DB_RW_PASSWORD: ${DB_RW_PASSWORD:-}
      DB_APP_NAME: ${DB_APP_NAME:-medkvadrat-patient-api}
      MEDIALOG_WRITE_ENABLED: ${MEDIALOG_WRITE_ENABLED:-false}
      MEDIALOG_WRITE_ALLOW_PATIENTS: ${MEDIALOG_WRITE_ALLOW_PATIENTS:-}
      MEDIALOG_WRITE_ALLOW_PL_SUBJ: ${MEDIALOG_WRITE_ALLOW_PL_SUBJ:-}
      MOTCONSU_POLL_ENABLED: ${MOTCONSU_POLL_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      WAITLIST_EXAM_IDS: ${WAITLIST_EXAM_IDS:-3118}
      WAITLIST_MIS_DAYS_BACK: ${WAITLIST_MIS_DAYS_BACK:-7}
      WAITLIST_MIS_DAYS_AHEAD: ${WAITLIST_MIS_DAYS_AHEAD:-60}
      # --- API ---
      API_PORT: ":8080"
      API_TOKEN: ${API_TOKEN}
      DEFAULT_MODELS_ID: ${DEFAULT_MODELS_ID:-306}
      CANCEL_MIN_HOURS_BEFORE: ${CANCEL_MIN_HOURS_BEFORE:-24}
      LK_BOOKING_PAIRS: ${LK_BOOKING_PAIRS:-}
      SLOT_TOKEN_SECRET: ${SLOT_TOKEN_SECRET:-}
      LK_AUTHOR_MEDECINS_ID: ${LK_AUTHOR_MEDECINS_ID:-2058}
      LK_AUTHOR_MEDDEP_ID: ${LK_AUTHOR_MEDDEP_ID:-10002309}
      BOOKING_MIN_HOURS_AHEAD: ${BOOKING_MIN_HOURS_AHEAD:-2}
      BOOKING_MAX_DAYS: ${BOOKING_MAX_DAYS:-14}
      BOOKING_MAX_FUTURE_PER_PATIENT: ${BOOKING_MAX_FUTURE_PER_PATIENT:-3}
      MEDIALOG_RW_TIMEOUT_SECONDS: ${MEDIALOG_RW_TIMEOUT_SECONDS:-30}
      # SQLite (OTP, refresh tokens, rate limits) — must be on a mounted volume
      GATEWAY_DB_PATH: /app/data/gateway.db
      # Auth (step 2+): not dev
      # Use pilot + JWT/OTP in production; dev keeps one-shot OTP without secrets.
      AUTH_MODE: ${AUTH_MODE:-dev}
      AUTH_PILOT_WHITELIST: ${AUTH_PILOT_WHITELIST:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-medkvadrat-patient-api}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_ADMIN_LOGIN: ${DASHBOARD_ADMIN_LOGIN:-admin}
      DASHBOARD_SECRET: ${DASHBOARD_SECRET:-}
      DASHBOARD_SESSION_TTL: ${DASHBOARD_SESSION_TTL:-12h}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-false}
      DASHBOARD_ALLOWED_CIDRS: ${DASHBOARD_ALLOWED_CIDRS:-192.168.0.0/16,127.0.0.1/32}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-МедКвадрат}
      SMTP_TLS: ${SMTP_TLS:-starttls}
    volumes:
      - gateway-data:/app/data
    ports:
      # Наружу публикуем только для отладки и для возможности дёрнуть
      # из других внутренних сервисов клиники. Если не нужно — убрать.
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  max-bot:
    image: ghcr.io/${GHCR_OWNER}/medkvadrat-max-bot:latest
    container_name: medkvadrat-max-bot
    restart: unless-stopped
    environment:
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      # Внутри compose-сети api-gateway доступен по имени сервиса
      GATEWAY_URL: http://api-gateway:8080
      GATEWAY_TOKEN: ${API_TOKEN}
      DB_PATH: /app/data/bot.db
      BOT_LINK_ALLOWLIST_PATIENTS: ${BOT_LINK_ALLOWLIST_PATIENTS:-}
      REMINDER_ALLOWLIST_PATIENTS: ${REMINDER_ALLOWLIST_PATIENTS:-}
      BOOKING_NOTICE_ENABLED: ${BOOKING_NOTICE_ENABLED:-false}
      BOT_CONSENT_ENABLED: ${BOT_CONSENT_ENABLED:-false}
      BOT_CONSENT_ADS_ENABLED: ${BOT_CONSENT_ADS_ENABLED:-false}
      BOT_CONSENT_SERVICE_VERSION: ${BOT_CONSENT_SERVICE_VERSION:-service-v1}
      BOT_CONSENT_ADS_VERSION: ${BOT_CONSENT_ADS_VERSION:-ads-v1}
      MAX_CONTACT_DEBUG: ${MAX_CONTACT_DEBUG:-0}
    depends_on:
      api-gateway:
        condition: service_healthy
    volumes:
      # Именованный том для SQLite — переживает docker compose down и обновления образа.
      # На хосте: /var/lib/docker/volumes/medkvadrat-bot-data/_data/bot.db
      - bot-data:/app/data
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge
    name: medkvadrat-internal

volumes:
  bot-data:
    name: medkvadrat-bot-data
  gateway-data:
    name: medkvadrat-gateway-data
