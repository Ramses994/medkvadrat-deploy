# Автодеплой продакшн-стенда через self-hosted runner на 192.168.2.122
#
# Триггеры:
#   - repository_dispatch типа "service-updated" (присылает workflow из medkvadrat-patient-api
#     или medkvadrat-max-bot после успешной сборки нового образа)
#   - push в main этого репо (изменился docker-compose.yml или deploy.sh)
#   - workflow_dispatch (ручной запуск из UI GitHub)

name: Deploy

on:
  repository_dispatch:
    types: [service-updated]
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'deploy.sh'
  workflow_dispatch:

concurrency:
  # Не даём двум деплоям бежать одновременно — второй встанет в очередь
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, medkvadrat-prod]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Log trigger
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Service: ${{ github.event.client_payload.service || 'n/a' }}"
          echo "SHA:     ${{ github.event.client_payload.sha || github.sha }}"

      - name: Verify .env exists on server
        run: |
          if [ ! -f .env ]; then
            echo "::error::.env не найден в $(pwd). Создать вручную на сервере из .env.example."
            exit 1
          fi

      - name: Login to GHCR
        # GITHUB_TOKEN self-hosted раннера имеет read:packages права в организации.
        # Если образы приватные в другой org — использовать secrets.GHCR_TOKEN.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull new images
        run: docker compose pull

      - name: Rolling up
        run: docker compose up -d

      - name: Prune dangling images
        run: docker image prune -f

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then
              echo "✓ api-gateway отвечает (попытка $i)"
              exit 0
            fi
            echo "попытка $i/6: жду 5с..."
            sleep 5
          done
          echo "::error::api-gateway не ответил после 30 секунд"
          docker compose logs --tail=80
          exit 1

      - name: Verify bot is running
        run: |
          status=$(docker inspect -f '{{.State.Status}}' medkvadrat-max-bot 2>/dev/null || echo "not-found")
          if [ "$status" != "running" ]; then
            echo "::error::max-bot не в состоянии running (status=$status)"
            docker compose logs max-bot --tail=80
            exit 1
          fi
          echo "✓ max-bot в running"

      - name: Final status
        if: always()
        run: docker compose ps
